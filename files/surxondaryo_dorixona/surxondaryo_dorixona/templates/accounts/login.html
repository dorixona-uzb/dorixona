{% extends 'base.html' %}

{% block title %}Kirish — Surxondaryo Dorixona{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card">
                <h2 class="fw-bold text-center mb-4">Tizimga kirish</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Login</label>
                        <input type="text" name="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parol</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger small">Login yoki parol xato!</div>
                    {% endif %}
                    <button type="submit" class="btn btn-success btn-lg w-100">Kirish</button>
                </form>
                <hr>
                <p class="text-center small text-muted mb-0">
                    Akkountingiz yo'qmi? <a href="{% url 'accounts:register' %}" class="text-success fw-bold">Ro'yxatdan o'ting</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
